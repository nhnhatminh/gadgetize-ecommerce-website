<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh Toán - Gadgetize</title>

    <link rel="stylesheet" href="styles/css/all.min.css" />
    <link rel="stylesheet" href="styles/css/bootstrap.min.css" />
    <link rel="stylesheet" href="styles/css/base.css" />
    <link rel="stylesheet" href="styles/css/checkout.css" />
  </head>
  <body>
    <div class="checkout-wrapper d-flex flex-column flex-lg-row min-vh-100">
      <div class="checkout-left col-12 col-lg-7 bg-white px-4 py-5 px-lg-5">
        <div class="checkout-content-inner mx-auto">
          <a
            href="index.html"
            class="text-decoration-none text-dark d-block mb-4"
          >
            <h2 class="fw-bold fs-3">Gadgetize</h2>
          </a>

          <div class="mb-5">
            <h4 class="fw-bold mb-3 fs-5">Liên hệ</h4>
            <input
              type="text"
              class="form-control py-3 mb-3"
              placeholder="Email hoặc số điện thoại di động"
            />
            <div class="form-check d-flex align-items-center gap-2">
              <input
                class="form-check-input m-0"
                type="checkbox"
                id="newsCheck"
              />
              <label class="form-check-label mt-1 text-dark" for="newsCheck">
                Gửi email cho tôi về tin tức và ưu đãi
              </label>
            </div>
          </div>

          <div class="mb-5">
            <h4 class="fw-bold mb-3 fs-5">Giao hàng</h4>
            <select class="form-select py-3 mb-3 text-dark">
              <option selected>Việt Nam</option>
            </select>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <input
                  type="text"
                  class="form-control py-3"
                  placeholder="Tên (không bắt buộc)"
                />
              </div>
              <div class="col-md-6">
                <input type="text" class="form-control py-3" placeholder="Họ" />
              </div>
            </div>

            <input
              type="text"
              class="form-control py-3 mb-3"
              placeholder="Địa chỉ"
            />
            <input
              type="text"
              class="form-control py-3 mb-3"
              placeholder="Căn hộ, số phòng, v.v. (không bắt buộc)"
            />

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <input
                  type="text"
                  class="form-control py-3"
                  placeholder="Thành phố"
                />
              </div>
              <div class="col-md-6">
                <input
                  type="text"
                  class="form-control py-3"
                  placeholder="Mã bưu điện (không bắt buộc)"
                />
              </div>
            </div>

            <div class="form-check d-flex align-items-center gap-2">
              <input
                class="form-check-input m-0"
                type="checkbox"
                id="saveInfoCheck"
              />
              <label
                class="form-check-label mt-1 text-dark"
                for="saveInfoCheck"
              >
                Lưu thông tin này cho lần sau
              </label>
            </div>
          </div>

          <div class="mb-5">
            <h4 class="fw-bold mb-3 fs-5">Phương thức vận chuyển</h4>
            <div
              class="border rounded-3 p-3 d-flex justify-content-between align-items-center bg-light-gray-custom"
            >
              <span class="text-dark">Tiêu chuẩn</span>
              <span class="fw-bold text-dark">MIỄN PHÍ</span>
            </div>
          </div>

          <div class="mb-5">
            <h4 class="fw-bold mb-1 fs-5">Thanh toán</h4>
            <p class="text-muted text-des mb-3">
              Mọi giao dịch đều được bảo mật và mã hóa.
            </p>

            <div class="payment-methods-box border rounded-3 overflow-hidden">
              <div
                class="payment-option p-3 border-bottom bg-light-gray-custom d-flex align-items-center gap-2"
              >
                <input
                  class="form-check-input m-0"
                  type="radio"
                  name="paymentMethod"
                  id="creditCard"
                  checked
                />
                <label
                  class="form-check-label fw-medium text-dark flex-grow-1"
                  for="creditCard"
                  >Thẻ tín dụng</label
                >
                <div class="payment-icons d-flex gap-1">
                  <i class="fa-brands fa-cc-visa fs-5 text-secondary"></i>
                  <i class="fa-brands fa-cc-mastercard fs-5 text-secondary"></i>
                </div>
              </div>

              <div class="payment-details p-3 bg-white">
                <input
                  type="text"
                  class="form-control py-3 mb-3"
                  placeholder="Số thẻ"
                />
                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <input
                      type="text"
                      class="form-control py-3"
                      placeholder="Ngày hết hạn (MM/YY)"
                    />
                  </div>
                  <div class="col-md-6">
                    <input
                      type="text"
                      class="form-control py-3"
                      placeholder="Mã bảo mật (CVV)"
                    />
                  </div>
                </div>
                <input
                  type="text"
                  class="form-control py-3"
                  placeholder="Tên trên thẻ"
                />
              </div>

              <div
                class="payment-option p-3 d-flex align-items-center gap-2 border-top"
              >
                <input
                  class="form-check-input m-0"
                  type="radio"
                  name="paymentMethod"
                  id="cod"
                />
                <label class="form-check-label text-dark" for="cod"
                  >Thanh toán khi nhận hàng (COD)</label
                >
              </div>
            </div>
          </div>

          <button
            type="button"
            class="btn btn-checkout-submit w-100 py-3 fw-medium text-white fs-6 rounded-3"
          >
            Thanh toán
          </button>
        </div>
      </div>

      <div
        class="checkout-right col-12 col-lg-5 px-4 py-5 px-lg-5 border-start border-light-subtle"
      >
        <div class="checkout-summary-inner mx-auto">
          <div class="summary-product d-flex align-items-center gap-3 mb-4">
            <div
              class="summary-product-img position-relative border rounded-3 bg-white p-2 d-flex align-items-center justify-content-center"
            >
              <img
                src="images/cate-3.png"
                alt="Silent Touch Pro"
                class="img-fluid object-fit-contain"
              />
              <span
                class="position-absolute top-0 start-100 translate-middle badge rounded-circle bg-secondary"
                >1</span
              >
            </div>
            <div class="flex-grow-1">
              <h6 class="mb-0 text-dark">Silent Touch Pro</h6>
            </div>
            <div class="fw-medium text-dark">9.800.000₫</div>
          </div>

          <div class="border-top border-bottom py-4 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="text-dark">Tạm tính</span>
              <span class="fw-medium text-dark">9.800.000₫</span>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="text-dark">Phí vận chuyển</span>
              <span class="fw-medium text-dark">Miễn phí</span>
            </div>
            <div class="d-flex justify-content-between align-items-center">
              <span class="text-dark">Thuế tạm tính</span>
              <span class="fw-medium text-dark">Thuế tạm tính</span>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center">
            <span class="fw-bold fs-5 text-dark">Tổng cộng</span>
            <div class="d-flex align-items-center gap-2">
              <span class="text-muted fs-7">VND</span>
              <span class="fw-bold fs-4 text-dark">11.368.000₫</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

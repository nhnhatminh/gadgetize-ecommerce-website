<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tài Khoản - Gadgetize</title>

    <link rel="stylesheet" href="styles/css/all.min.css" />
    <link rel="stylesheet" href="styles/css/bootstrap.min.css" />
    <link rel="stylesheet" href="styles/css/base.css" />
    <link rel="stylesheet" href="styles/css/auth.css" />
  </head>
  <body>
    <div
      class="auth-container d-flex align-items-center justify-content-center min-vh-100"
    >
      <div
        class="auth-card bg-white rounded-4 shadow-sm border border-light-subtle p-4 p-sm-5 m-3"
      >
        <div class="text-center mb-4">
          <a href="index.html" class="d-inline-block mb-3">
            <img src="images/logo.png" alt="Gadgetize Logo" class="auth-logo" />
          </a>
          <p class="text-muted text-des mb-0">
            Hệ thống kết nối và mua sắm thiết bị công nghệ hàng đầu
          </p>
        </div>

        <ul
          class="nav nav-tabs auth-tabs justify-content-center border-bottom mb-4"
          id="authTab"
          role="tablist"
        >
          <li class="nav-item" role="presentation">
            <button
              class="nav-link active"
              id="login-tab"
              data-bs-toggle="tab"
              data-bs-target="#login-pane"
              type="button"
              role="tab"
            >
              Đăng Nhập
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="register-tab"
              data-bs-toggle="tab"
              data-bs-target="#register-pane"
              type="button"
              role="tab"
            >
              Đăng Ký
            </button>
          </li>
        </ul>

        <div class="tab-content" id="authTabContent">
          <div
            class="tab-pane fade show active"
            id="login-pane"
            role="tabpanel"
          >
            <form class="auth-form">
              <div class="mb-3">
                <label class="form-label text-dark fw-medium"
                  >Địa chỉ Email / Số điện thoại</label
                >
                <input
                  type="text"
                  class="form-control py-3"
                  placeholder="Nhập email hoặc số điện thoại"
                />
              </div>
              <div class="mb-3">
                <div
                  class="d-flex justify-content-between align-items-center mb-1"
                >
                  <label class="form-label text-dark fw-medium mb-0"
                    >Mật khẩu</label
                  >
                  <a href="#" class="forgot-password-link text-des text-muted"
                    >Quên mật khẩu?</a
                  >
                </div>
                <input
                  type="password"
                  class="form-control py-3"
                  placeholder="Nhập mật khẩu của bạn"
                />
              </div>
              <div class="mb-4 form-check d-flex align-items-center gap-2">
                <input
                  type="checkbox"
                  class="form-check-input m-0"
                  id="rememberMe"
                />
                <label
                  class="form-check-label text-des text-muted mt-1"
                  for="rememberMe"
                  >Ghi nhớ đăng nhập</label
                >
              </div>
              <button
                type="button"
                class="btn btn-auth-submit w-100 py-3 fw-medium text-white rounded-3 mb-3"
              >
                Đăng Nhập
              </button>
            </form>
          </div>

          <div class="tab-pane fade" id="register-pane" role="tabpanel">
            <form class="auth-form">
              <div class="row g-3 mb-3">
                <div class="col-sm-6">
                  <label class="form-label text-dark fw-medium">Họ</label>
                  <input
                    type="text"
                    class="form-control py-3"
                    placeholder="Nhập họ"
                  />
                </div>
                <div class="col-sm-6">
                  <label class="form-label text-dark fw-medium">Tên</label>
                  <input
                    type="text"
                    class="form-control py-3"
                    placeholder="Nhập tên"
                  />
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label text-dark fw-medium"
                  >Địa chỉ Email</label
                >
                <input
                  type="email"
                  class="form-control py-3"
                  placeholder="example@domain.com"
                />
              </div>
              <div class="mb-3">
                <label class="form-label text-dark fw-medium"
                  >Số điện thoại</label
                >
                <input
                  type="text"
                  class="form-control py-3"
                  placeholder="Nhập số điện thoại"
                />
              </div>
              <div class="mb-3">
                <label class="form-label text-dark fw-medium">Mật khẩu</label>
                <input
                  type="password"
                  class="form-control py-3"
                  placeholder="Tối thiểu 6 ký tự"
                />
              </div>
              <div class="mb-4 form-check d-flex align-items-center gap-2">
                <input
                  type="checkbox"
                  class="form-check-input m-0"
                  id="agreeTerms"
                />
                <label
                  class="form-check-label text-des text-muted mt-1"
                  for="agreeTerms"
                >
                  Tôi đồng ý với các
                  <a href="#" class="text-dark fw-medium text-decoration-none"
                    >Điều khoản dịch vụ</a
                  >
                </label>
              </div>
              <button
                type="button"
                class="btn btn-auth-submit w-100 py-3 fw-medium text-white rounded-3 mb-3"
              >
                Tạo Tài Khoản
              </button>
            </form>
          </div>
        </div>

        <div
          class="position-relative d-flex align-items-center justify-content-center my-4"
        >
          <div
            class="position-absolute border-top w-100 border-light-subtle"
          ></div>
          <span class="position-relative bg-white px-3 text-muted text-des"
            >Hoặc kết nối qua</span
          >
        </div>

        <div class="d-flex gap-3">
          <button
            type="button"
            class="btn btn-social-login w-50 py-2 d-flex align-items-center justify-content-center gap-2 rounded-3 text-dark fw-medium border"
          >
            <i class="fa-brands fa-google text-danger fs-5"></i> Google
          </button>
          <button
            type="button"
            class="btn btn-social-login w-50 py-2 d-flex align-items-center justify-content-center gap-2 rounded-3 text-dark fw-medium border"
          >
            <i class="fa-brands fa-facebook text-primary fs-5"></i> Facebook
          </button>
        </div>
      </div>
    </div>

    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
